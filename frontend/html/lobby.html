<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play — Kairos Chess</title>
    <link rel="stylesheet" href="../assets/main.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/Kairos%20chess%20favicon%20design/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/Kairos%20chess%20favicon%20design/favicon-32.png"
    />
    <link
      rel="apple-touch-icon"
      href="../assets/Kairos%20chess%20favicon%20design/apple-touch-icon.png"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="../index.html" class="nav-brand">
          <img
            src="../assets/Kairos%20chess%20favicon%20design/favicon.svg"
            alt=""
          />
          Kairos<span class="accent">Chess</span>
        </a>
        <nav>
          <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="./lobby.html" class="active">Play</a></li>
            <li><a href="./rules.html">Rules</a></li>
          </ul>
        </nav>
        <div class="nav-actions">
          <a href="#" class="btn btn-ghost btn-sm">Log In</a>
          <a href="#" class="btn btn-primary btn-sm">Sign Up</a>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="page-header">
          <h1>Find a match</h1>
          <p>Jump into an open game or start one of your own.</p>
        </div>

        <div class="lobby-layout">
          <div class="lobby-main">
            <div class="lobby-actions">
              <a href="./game.html" class="btn btn-primary">Create Game</a>
              <a href="./game.html" class="btn btn-secondary">Quick Match</a>
            </div>

            <div class="game-list">
              <div class="game-list-head">
                <span>Player</span>
                <span>Time control</span>
                <span>Rating</span>
                <span>Status</span>
                <span></span>
              </div>

            </div>
          </div>

          <aside class="card profile-card">
            <h3>Your profile</h3>
            <div class="profile-identity">
              <span class="avatar">YOU</span>
              <div>
                <strong>Guest Player</strong>
                <span>Not signed in</span>
              </div>
            </div>
            <div class="stat-row"><span>Rating</span><span>&mdash;</span></div>
            <div class="stat-row"><span>Games played</span><span>0</span></div>
            <div class="stat-row"><span>Win rate</span><span>&mdash;</span></div>
          </aside>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Kairos Chess.</p>
        <ul class="footer-links">
          <li><a href="./rules.html">Rules</a></li>
          <li><a href="https://github.com/bumblemusprime7-glitch/kairos">GitHub</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
